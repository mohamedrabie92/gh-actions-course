name:  03 - Workflow Runners
on:
    push:

jobs:
    ubuntu-echo:
        runs-on: ubuntu-latest
        steps:
            - name: Show OS
              run: |
                echo "This job is running on an Ubuntu server."
                echo "The OS is $RUNNER_OS"
    windows-echo:
        runs-on: windows-latest
        steps:
            - name: Show OS
              run: |
                shell: bash
                echo "This job is running on a Windows server."
                echo "The OS is $RUNNER_OS"
    macOS-echo:
        runs-on: macos-latest
        steps:
            - name: Show OS
              run: |
                echo "This job is running on a macOS server."
                echo "The OS is $RUNNER_OS"

