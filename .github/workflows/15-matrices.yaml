name: 15 - Working with Matrices
on:
  workflow_dispatch:

jobs:
  backwards-compatibility:
    name: ${{ matrix.OS-types }}-${{ matrix.node-version }}
    runs-on: ${{ matrix.OS-types }}
    strategy:
      fail-fast: false
      matrix:
        Node-version: [24.x, 26.x]
        OS-types:
          - ubuntu-latest
          - windows-latest
        include:
            - OS-types: ubuntu-latest
              node-version: 28.x
              tag: experimental

    steps:
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.Node-version }}
      - name: Fail if experimental
        if: matrix.tag == 'experimental'
        run: |
            exit 1
      - name: Perform some tests
        run: |
           echo "Running tests on OS ${{ matrix.OS-types }} and NodeJS ${{ matrix.Node-version }}"
           sleep 10
      - name: Upload test results
        run: |
           echo "Uploading test results"
                
    
  include-example:
    name: ${{matrix.color}}-${{matrix.shape}}-${{matrix.size}}-${{matrix.opacity}}
    runs-on: ubuntu-latest
    strategy:
        matrix:
            color: [red, green]
            shape: [circle, square]
            size:  [small, large]
            include:
                - opacity: 50
                - color: red
                  opacity: 75
                - shape: circle
                  opacity: 100
                - color: red
                  shape: triangle
    
    steps:
        - name: Dummy step
          run: |
             echo "${{matrix.color}}-${{matrix.shape}}-${{matrix.size}}-${{matrix.opacity}}"