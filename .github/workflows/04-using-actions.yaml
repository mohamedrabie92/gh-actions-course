name: 04 - Using Actions
on:
    push:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Printing Folders
              run: ls -lha
            
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                node-version: '24.x'
            
            - name: Install Dependencies
              run: npm ci
              working-directory: ./04-using-actions/react-app

            - name: Run Unit Tests
              run: npm run test
              working-directory: ./04-using-actions/react-app